# Production-oriented foundation. Run: docker compose -f docker-compose.prod.yml up -d --build
services:
  backend:
    build:
      context: .
      target: prod
    env_file: .env
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
    ports:
      - "5000:5000"
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  uploads:
  redis-data:
